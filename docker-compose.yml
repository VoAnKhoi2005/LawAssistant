services:
  mongodb:
    image: mongo:7
    container_name: lawassistant-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: lawassistant-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        PYTHON_VERSION: 3.13.14
        TORCH_VERSION: 2.7.0
    container_name: lawassistant-backend
    depends_on:
      - mongodb
      - redis
    env_file:
      - app/backend/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: ${DOCKER_WORKER_CONCURRENCY:-2}
      AUTO_START_WORKER: ${DOCKER_AUTO_START_WORKER:-true}
      GOOGLE_APPLICATION_CREDENTIALS: ${DOCKER_GOOGLE_APPLICATION_CREDENTIALS:-/opt/credentials/google-service-account.json}
      VNCORENLP_MODEL_PATH: ${DOCKER_VNCORENLP_MODEL_PATH:-/app/infrastructure/document_processing/nlp_models/VnCoreNLP-1.2}
      PHONLP_MODEL_PATH: ${DOCKER_PHONLP_MODEL_PATH:-/app/infrastructure/document_processing/nlp_models/phonlp}
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8000}
    container_name: lawassistant-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        PYTHON_VERSION: 3.13.14
        TORCH_VERSION: 2.7.0
    container_name: lawassistant-worker
    depends_on:
      - mongodb
      - redis
    env_file:
      - app/backend/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: ${DOCKER_WORKER_CONCURRENCY:-2}
      AUTO_START_WORKER: ${DOCKER_AUTO_START_WORKER:-false}
      GOOGLE_APPLICATION_CREDENTIALS: ${DOCKER_GOOGLE_APPLICATION_CREDENTIALS:-/opt/credentials/google-service-account.json}
      VNCORENLP_MODEL_PATH: ${DOCKER_VNCORENLP_MODEL_PATH:-/app/infrastructure/document_processing/nlp_models/VnCoreNLP-1.2}
      PHONLP_MODEL_PATH: ${DOCKER_PHONLP_MODEL_PATH:-/app/infrastructure/document_processing/nlp_models/phonlp}
    command: python worker/worker.py
    profiles:
      - worker

volumes:
  mongodb_data:
  redis_data:
